        @keyframes ucl-trophy-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
        }
        .ucl-confetti-piece {
            position: fixed;
            top: -20px;
            width: 8px;
            height: 14px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
            pointer-events: none;
            z-index: 9999;
        }
        .simulation-container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .simulation-container.knockout-layout {
            grid-template-columns: 1.5fr 1fr;
        }
        @media (max-width: 992px) {
            .simulation-container,
            .simulation-container.knockout-layout { grid-template-columns: 1fr; }
        }
        /* UCL Stage Progress Tracker */
        .ucl-stage-tracker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.25rem;
        }
        .ucl-stage-step {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            white-space: nowrap;
        }
        .ucl-stage-step.active {
            color: #c9a227;
            border-color: rgba(201,162,39,0.5);
            background: rgba(201,162,39,0.1);
            box-shadow: 0 0 10px rgba(201,162,39,0.2);
        }
        .ucl-stage-step.done {
            color: rgba(255,255,255,0.45);
            border-color: rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05);
        }
        .ucl-stage-arrow {
            color: rgba(255,255,255,0.15);
            font-size: 0.65rem;
            flex-shrink: 0;
            margin: 0 0.1rem;
        }
        /* UCL Header Banner */
        .ucl-banner {
            text-align: center;
            padding: 1.25rem 1rem 0.75rem;
            position: relative;
            z-index: 1;
        }
        .ucl-banner-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.3rem;
        }
        .ucl-banner-star {
            width: 22px;
            height: 22px;
            fill: #c9a227;
            color: #c9a227;
            opacity: 0.85;
        }
        .ucl-banner-title {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #c9a227;
            opacity: 0.9;
        }
        .ucl-banner-subtitle {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            color: #fff;
            line-height: 1.1;
        }
        .ucl-banner-stage {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.45);
            margin-top: 0.3rem;
            letter-spacing: 0.08em;
        }
        .ucl-banner-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(201,162,39,0.4) 30%, rgba(201,162,39,0.7) 50%, rgba(201,162,39,0.4) 70%, transparent 100%);
            margin: 0.75rem auto;
            max-width: 400px;
        }
        /* Panels */
        .sim-panel {
            background: rgba(4,10,26,0.88);
            border: 1px solid rgba(201,162,39,0.2);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative;
            z-index: 1;
        }
        .sim-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(201,162,39,0.15);
            padding-bottom: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .sim-header-row h2 {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #c9a227;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        /* Swiss Table */
        .ucl-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        .ucl-table th, .ucl-table td {
            padding: 0.45rem 0.35rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .ucl-table th { color: rgba(201,162,39,0.6); font-weight: 700; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
        .ucl-table tr { transition: background 0.15s; }
        .ucl-table tr:hover { background: rgba(255,255,255,0.025); }
        /* Zone color bars */
        .ucl-table tr.zone-direct { border-left: 3px solid #c9a227; }
        .ucl-table tr.zone-playoff { border-left: 3px solid #3b82f6; }
        .ucl-table tr.zone-out { border-left: 3px solid rgba(239,68,68,0.5); opacity: 0.6; }
        .ucl-table tr.user-row {
            background: rgba(201,162,39,0.1) !important;
            border-left: 3px solid #c9a227 !important;
        }
        .ucl-table tr.user-row td { color: #c9a227 !important; font-weight: 700; }
        .ucl-table tr.user-row:hover { background: rgba(201,162,39,0.16) !important; }
        .ucl-table .rank-num { width: 24px; text-align: center; font-weight: 700; }
        .ucl-table .team-name-cell { display: flex; align-items: center; gap: 0.4rem; }
        .ucl-table .stat-num { text-align: center; width: 28px; color: rgba(255,255,255,0.55); }
        .ucl-table .stat-pts { text-align: center; width: 36px; font-weight: 800; color: #fff; }
        .ucl-table tr.user-row .stat-pts { color: #c9a227 !important; }
        /* Zone Legend */
        .ucl-zone-legend {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.7rem;
            padding: 0.5rem 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 0.25rem;
        }
        .ucl-zone-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 2px;
            margin-right: 4px;
            vertical-align: middle;
        }
        /* Match items */
        .sim-btn-group { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .sim-matches-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .sim-match-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 0.55rem 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.83rem;
            transition: border-color 0.2s;
        }
        .sim-match-item.has-played { background: rgba(255,255,255,0.015); }
        .sim-match-team { flex: 1; display: flex; align-items: center; gap: 0.4rem; }
        .sim-match-team.home { justify-content: flex-end; text-align: right; }
        .sim-match-team.away { justify-content: flex-start; text-align: left; }
        .sim-match-score {
            min-width: 64px;
            text-align: center;
            font-family: 'Plus Jakarta Sans', monospace;
            font-size: 1rem;
            font-weight: 800;
            background: rgba(201,162,39,0.1);
            border: 1px solid rgba(201,162,39,0.2);
            border-radius: 6px;
            padding: 0.2rem 0;
            margin: 0 0.5rem;
            color: #fff;
        }
        .sim-match-score.unplayed { color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); font-size: 0.85rem; }
        /* User match highlight */
        .sim-match-item.user-match,
        .bracket-match.user-match {
            background: linear-gradient(135deg, rgba(201,162,39,0.12) 0%, rgba(14,33,77,0.18) 100%) !important;
            border: 1px solid rgba(201,162,39,0.45) !important;
            animation: ucl-glow-pulse 2.5s ease-in-out infinite;
        }
        /* Setup box */
        .sim-setup-box {
            max-width: 520px;
            margin: 3rem auto;
            background: rgba(4,10,26,0.9);
            border: 1px solid rgba(201,162,39,0.3);
            border-radius: 20px;
            padding: 2.25rem 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(201,162,39,0.08);
            position: relative;
            z-index: 1;
        }
        .sim-setup-title {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-size: 1.75rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.04em;
        }
        .sim-setup-stats {
            background: rgba(201,162,39,0.05);
            border: 1px solid rgba(201,162,39,0.15);
            border-radius: 10px;
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        .sim-setup-stat-item { display: flex; flex-direction: column; gap: 0.25rem; }
        .sim-setup-stat-label { font-size: 0.7rem; color: rgba(201,162,39,0.6); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
        .sim-setup-stat-value { font-size: 1.35rem; font-weight: 800; color: #fff; }
        /* Bracket */
        .bracket-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .bracket-match {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(201,162,39,0.15);
            border-radius: 10px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }
        .bracket-match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .bracket-match-row.winner { font-weight: 700; color: #c9a227; }
        .bracket-match-row.loser { opacity: 0.4; }
        .bracket-match-row.winner .score-cell { color: #c9a227; background: rgba(201,162,39,0.15); }
        .bracket-match-row .score-cell {
            display: inline-block;
            width: 26px;
            text-align: center;
            padding: 0.1rem 0;
        }
        .score-cell {
            font-family: 'Plus Jakarta Sans', monospace;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(201,162,39,0.08);
            border: 1px solid rgba(201,162,39,0.2);
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            color: #fff;
        }
        .badge-pos { font-size: 0.65rem; padding: 0.1rem 0.3rem; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .badge-home { background: rgba(59,130,246,0.15); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
        .badge-away { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }

        .match-details-panel {
            animation: ucl-fade-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes ucl-fade-in {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- UCL Theme Overrides for #simulation-tab --- */
        #simulation-tab {
            background: radial-gradient(ellipse at 50% -10%, #0f2152 0%, #07112a 55%, #030a18 100%) !important;
            border: 1px solid rgba(201,162,39,0.18) !important;
            border-radius: 16px;
            padding: 1.5rem !important;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        #simulation-tab::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(rgba(201,162,39,0.025) 1px, transparent 0),
                radial-gradient(rgba(255,255,255,0.012) 1.5px, transparent 0);
            background-size: 36px 36px, 72px 72px;
            background-position: 0 0, 18px 18px;
            pointer-events: none;
            z-index: 0;
            border-radius: 16px;
        }
        #simulation-tab * {
            scrollbar-width: thin;
            scrollbar-color: rgba(201,162,39,0.3) rgba(255,255,255,0.02);
        }
        #simulation-tab *::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        #simulation-tab *::-webkit-scrollbar-track {
            background: rgba(4,10,26,0.5);
            border-radius: 3px;
        }
        #simulation-tab *::-webkit-scrollbar-thumb {
            background: rgba(201,162,39,0.25);
            border-radius: 3px;
        }
        #simulation-tab *::-webkit-scrollbar-thumb:hover {
            background: rgba(201,162,39,0.5);
        }

        #simulation-tab .btn {
            font-family: 'Inter', sans-serif !important;
            background: linear-gradient(135deg, #0e214d 0%, #1a3a7a 100%) !important;
            border: 1px solid rgba(201,162,39,0.45) !important;
            color: #fff !important;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            text-transform: uppercase;
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.07em;
            transition: all 0.22s ease;
            position: relative;
            overflow: hidden;
        }
        #simulation-tab .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(201,162,39,0.12) 50%, transparent 100%);
            background-size: 200% 100%;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #simulation-tab .btn:hover::after { opacity: 1; animation: ucl-shimmer 0.8s linear; }
        #simulation-tab .btn:hover {
            border-color: #c9a227 !important;
            box-shadow: 0 0 18px rgba(201,162,39,0.35), 0 4px 16px rgba(0,0,0,0.4);
            transform: translateY(-1px);
        }
        #simulation-tab .btn-secondary {
            background: rgba(4,10,26,0.7) !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            color: rgba(255,255,255,0.75) !important;
        }
        #simulation-tab .btn-secondary:hover {
            background: rgba(255,255,255,0.07) !important;
            border-color: rgba(201,162,39,0.4) !important;
            color: #fff !important;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo-area">
                <div class="logo-icon">
                    <i data-lucide="shield-check" style="color: #fff;"></i>
                </div>
                <div>
                    <h1>BALLERS<span>DECK</span></h1>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
                <button id="btn-export-db" class="db-connect-btn" onclick="exportDatabaseFile()">
                    <i data-lucide="download"></i> Xuất Database JS
                </button>
                <div class="nav-tabs">
                    <button class="tab-btn active" onclick="switchTab('library')">
                        <i data-lucide="layout-grid"></i> Thư viện Thẻ
                    </button>
                    <button class="tab-btn" onclick="switchTab('squad')">
                        <i data-lucide="footprints"></i> Squad Builder
                    </button>
                    <button class="tab-btn" onclick="switchTab('simulation')">
                        <i data-lucide="trophy"></i> UCL Simulation
                    </button>
                </div>
            </div>
        </header>

        <!-- ================= TAB: LIBRARY ================= -->
        <div id="library-tab" class="tab-content active">
            <div class="control-panel">
                <!-- ROW 1: Search + Actions -->
                <div class="search-row">
                    <div class="search-main">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" id="search-input" placeholder="Tìm kiếm cầu thủ theo tên..." oninput="applyFilters()">
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="exportData()" title="Xuất JSON">
                            <i data-lucide="download"></i>
                        </button>
                        <button class="btn btn-secondary" onclick="triggerImport()" title="Nhập JSON">
                            <i data-lucide="upload"></i>
                        </button>
                        <input type="file" id="import-file-input" style="display:none;" accept=".json" onchange="importData(event)">
                        <button class="btn" onclick="openAddDrawer()">
                            <i data-lucide="plus-circle"></i> Thêm Thẻ
                        </button>
                    </div>
                </div>

                <!-- ROW 2: Filter Chips -->
                <div class="filter-row">
                    <!-- League -->
                    <div class="filter-chip custom-dropdown" id="chip-league">
                        <label>Giải đấu</label>
                        <span class="custom-select-trigger" id="league-trigger-val">All</span>
                        <input type="hidden" id="filter-league" value="">
                        <div class="custom-dropdown-menu" id="league-dropdown-menu"></div>
                    </div>

                    <!-- Club -->
                    <div class="filter-chip custom-dropdown" id="chip-club">
                        <label>CLB</label>
                        <span class="custom-select-trigger" id="club-trigger-val">All</span>
                        <input type="hidden" id="filter-club" value="">
                        <div class="custom-dropdown-menu" id="club-dropdown-menu"></div>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- Nationality -->
                    <div class="filter-chip custom-dropdown" id="chip-nation">
                        <label>Quốc tịch</label>
                        <span class="custom-select-trigger" id="nation-trigger-val">All</span>
                        <input type="hidden" id="filter-nation" value="">
                        <div class="custom-dropdown-menu" id="nation-dropdown-menu"></div>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- Position -->
                    <div class="filter-chip custom-dropdown" id="chip-position">
                        <label>Vị trí</label>
                        <span class="custom-select-trigger" id="position-trigger-val">All</span>
                        <input type="hidden" id="filter-position" value="">
                        <div class="custom-dropdown-menu" id="position-dropdown-menu"></div>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- Season / Theme -->
                    <div class="filter-chip custom-dropdown" id="chip-theme">
                        <label>Mùa thẻ</label>
                        <span class="custom-select-trigger" id="theme-trigger-val">All</span>
                        <input type="hidden" id="filter-theme" value="">
                        <div class="custom-dropdown-menu" id="theme-dropdown-menu"></div>
                    </div>

                    <div class="filter-divider"></div>

                    <!-- Sort -->
                    <div class="filter-chip custom-dropdown" id="chip-sort">
                        <label>Sắp xếp</label>
                        <span class="custom-select-trigger" id="sort-trigger-val">OVR ↓</span>
                        <input type="hidden" id="sort-by" value="rating-desc">
                        <div class="custom-dropdown-menu" id="sort-dropdown-menu"></div>
                    </div>

                    <div id="filter-count-box" class="filter-count-box">
                        Tìm thấy: <span id="filter-count-num">0</span> cầu thủ
                    </div>

                    <button class="filter-reset-btn" onclick="resetFilters()" title="Xóa bộ lọc">
                        <i data-lucide="x" style="width:12px;height:12px;"></i> Xóa lọc
                    </button>
                </div>
            </div>

            <!-- Player Grid -->
            <div class="player-grid" id="player-grid"></div>
        </div>

        <!-- ================= TAB: SQUAD BUILDER ================= -->
        <div id="squad-tab" class="tab-content">
            <div class="squad-builder-container">
                <!-- Pitch Area -->
                <div class="pitch-container" id="football-pitch">
                <div class="pitch-bg-wrapper">
                        <div class="pitch-goal"></div>
                        <div class="pitch-halfway-line"></div>
                        <div class="pitch-center-arc"></div>
                        <div class="pitch-center-spot"></div>
                        <div class="pitch-penalty-box"></div>
                        <div class="pitch-goal-area"></div>
                        <div class="pitch-penalty-arc"></div>
                        <div class="pitch-penalty-spot"></div>
                        <div class="pitch-corner-tl"></div>
                        <div class="pitch-corner-bl"></div>
                        <!-- Extra corners shown only in vertical/mobile layout -->
                        <div class="pitch-corner-tr"></div>
                        <div class="pitch-corner-br"></div>
                    </div>
                    <!-- Dynamically generated slots will go here -->
                </div>

                <!-- Squad Stats and Actions Sidebar -->
                <div class="squad-stats-panel">
                    <!-- Team OVR -->
                    <div class="team-ovr-block">
                        <div class="team-ovr-label">Team OVR</div>
                        <div class="team-ovr-value" id="team-rating">00</div>
                    </div>

                    <!-- DEF / MID / ATK -->
                    <div class="squad-zone-stats">
                        <div class="zone-stat-box def">
                            <div class="zone-stat-lbl">DEF</div>
                            <div class="zone-stat-val" id="zone-def">--</div>
                        </div>
                        <div class="zone-stat-box mid">
                            <div class="zone-stat-lbl">MID</div>
                            <div class="zone-stat-val" id="zone-mid">--</div>
                        </div>
                        <div class="zone-stat-box atk">
                            <div class="zone-stat-lbl">ATK</div>
                            <div class="zone-stat-val" id="zone-atk">--</div>
                        </div>
                    </div>

                    <!-- Chemistry bar -->
                    <div class="chem-block">
                        <div class="chem-header">
                            <span class="chem-label">⚗ Chemistry</span>
                            <span class="chem-score" id="team-chemistry">0/33</span>
                        </div>
                        <div class="chem-bar-track">
                            <div class="chem-bar-fill" id="chem-bar-fill"></div>
                        </div>
                    </div>

                    <!-- Formation custom dropdown (2-level) -->
                    <div style="position: relative;">
                        <span class="formation-label">⚽ Sơ đồ chiến thuật</span>
                        <div class="formation-trigger" id="formation-trigger" onclick="toggleFormationDropdown()">
                            <div class="formation-trigger-left">
                                <div class="formation-icon">🗂</div>
                                <span class="formation-trigger-name" id="formation-trigger-name">4-3-3</span>
                            </div>
                            <span class="formation-trigger-arrow">▼</span>
                        </div>
                        <div class="formation-dropdown-menu" id="formation-dropdown-menu"></div>
                        <!-- Hidden select to maintain compatibility -->
                        <select id="formation-select" onchange="changeFormation()" style="display:none;">
                            <option value="4-3-3">4-3-3</option>
                            <option value="4-3-3 Holding">4-3-3 Holding</option>
                            <option value="4-3-3 Double Pivot">4-3-3 Double Pivot</option>
                            <option value="4-3-3 Attack">4-3-3 Attack</option>
                            <option value="4-3-2-1">4-3-2-1</option>
                            <option value="4-4-2">4-4-2</option>
                            <option value="4-4-2 Diamond">4-4-2 Diamond</option>
                            <option value="4-4-2 Narrow">4-4-2 Narrow</option>
                            <option value="4-4-1-1">4-4-1-1</option>
                            <option value="4-2-3-1">4-2-3-1</option>
                            <option value="4-1-3-2">4-1-3-2</option>
                            <option value="4-1-3-2 Narrow">4-1-3-2 Narrow</option>
                            <option value="4-1-4-1">4-1-4-1</option>
                            <option value="3-4-3">3-4-3</option>

    <script>
        function getConfederation(nationality) {
            const lower = (nationality || "").trim().toLowerCase();
            return CONFEDERATIONS[lower] || "Khác";
        }

        function getLeagueConfederation(leagueName) {
            const uefaLeagues = [
                'Premier League', 'La Liga', 'Serie A', 'Bundesliga', 'Ligue 1',
                'Eredivisie', 'Liga Portugal', 'Süper Lig', 'EFL Championship',
                'Scottish Premiership', 'Danish Superliga', 'Russian PL',
                'EFL League One', 'Austrian Bundesliga', 'Belgian Pro League', 'Others (UEFA)',
                'Serie B', '2. Bundesliga', 'Ligue 2', 'La Liga 2'
            ];
            const conmebolLeagues = ['Brasileirao Serie A', 'Brasileirão Série A', 'Brasileirao Série A', 'Brasileirão Serie A', 'Liga Profesional de Fútbol', 'Others (CONMEBOL)'];
            const concacafLeagues = ['MLS'];
            const afcLeagues = ['Saudi Pro League', 'A-League', 'V-League', 'Thai League', 'J-League', 'K-League', 'Qatar Stars League', 'UAE Pro League'];
            
            if (uefaLeagues.includes(leagueName)) return 'UEFA';
            if (conmebolLeagues.includes(leagueName)) return 'CONMEBOL';
            if (concacafLeagues.includes(leagueName)) return 'CONCACAF';
            if (afcLeagues.includes(leagueName)) return 'AFC';
            
            return 'Khác';
        }

        function sortLeagues(list, conf) {
            if (conf === 'UEFA') {
                const priority = ['Premier League', 'La Liga', 'Bundesliga', 'Serie A', 'Ligue 1'];
                const hasOthers = list.includes('Others (UEFA)');
                const others = list.filter(l => !priority.includes(l) && l !== 'Others (UEFA)').sort();
                const sorted = [];
                priority.forEach(p => {
                    if (list.includes(p)) sorted.push(p);
                });
                sorted.push(...others);
                if (hasOthers) {
                    sorted.push('Others (UEFA)');
                }
                return sorted;
            }
            return [...list].sort();
        }

        const POSITION_ORDER = {
            'GK': 1,
            'CB': 2, 'LB': 3, 'RB': 4, 'LWB': 5, 'RWB': 6,
            'CDM': 7, 'CM': 8, 'LM': 9, 'RM': 10, 'CAM': 11,
            'LW': 12, 'RW': 13, 'CF': 14, 'ST': 15
        };

        function getPositionRank(pos) {
            return POSITION_ORDER[pos] || 99;
        }

        function getDisplayPos(slotPos) {
            if (slotPos === 'LST' || slotPos === 'RST' || slotPos === 'ST1' || slotPos === 'ST2') {
                return 'ST';
            }
            if (slotPos === 'CF1' || slotPos === 'CF2') {
                return 'CF';
            }
            if (slotPos === 'LCB' || slotPos === 'RCB' || slotPos === 'CB') {
                return 'CB';
            }
            if (slotPos === 'LCM' || slotPos === 'RCM' || slotPos === 'CM') {
                return 'CM';
            }
            if (slotPos === 'LDM' || slotPos === 'RDM' || slotPos === 'CDM' || slotPos === 'LCDM' || slotPos === 'RCDM') {
                return 'CDM';
            }
            if (slotPos === 'CAM1' || slotPos === 'CAM2' || slotPos === 'LCAM' || slotPos === 'RCAM') {
                return 'CAM';
            }
            return slotPos;
        }

        function isCompatiblePosition(slotPos, playerPos, altPositions = []) {
            const allPos = [playerPos, ...(altPositions || [])];
            const mapping = {
                "GK": ["GK"],
                "LB": ["LB", "LWB"],
                "RB": ["RB", "RWB"],
                "LWB": ["LWB", "LB"],
                "RWB": ["RWB", "RB"],
                "CB": ["CB"],
                "LCB": ["CB"],
                "RCB": ["CB"],
                "CDM": ["CDM"],
                "LDM": ["CDM"],
                "RDM": ["CDM"],
                "LCDM": ["CDM"],
                "RCDM": ["CDM"],
                "CM": ["CM"],
                "LCM": ["CM"],
                "RCM": ["CM"],
                "LM": ["LM", "LW"],
                "RM": ["RM", "RW"],
                "CAM": ["CAM"],
                "CAM1": ["CAM", "CF"],
                "CAM2": ["CAM", "CF"],
                "LCAM": ["CAM", "CF"],
                "RCAM": ["CAM", "CF"],
                "LW": ["LW", "LM"],
                "RW": ["RW", "RM"],
                "ST": ["ST", "CF"],
                "LST": ["ST", "CF"],
                "RST": ["ST", "CF"],
                "ST1": ["ST", "CF"],
                "ST2": ["ST", "CF"],
                "CF1": ["CF", "ST"],
                "CF2": ["CF", "ST"]
            };
            const allowed = mapping[slotPos] || [slotPos];
            return allPos.some(pos => allowed.includes(pos));
        }

        function getFlagImgHTML(nationality, flagEmoji) {
            const nationLower = (nationality || "").trim().toLowerCase();
            const code = COUNTRY_CODES[nationLower];
            if (code) {
                return `<img src="https://flagcdn.com/w40/${code}.png" class="panini-flag-img" alt="${nationality}" style="width: 20px; height: 13px; object-fit: cover; border-radius: 1px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); display: inline-block; vertical-align: middle;">`;
            }
            return `<span class="panini-flag" title="${nationality}">${flagEmoji || ""}</span>`;
        }

        // --- 3. GLOBAL STATE ---
        let players = [];
        let squad = {}; // formation slot -> player ID mapping
        Object.defineProperty(window, 'players', {
            get: function() { return players; },
            set: function(val) { players = val; }
        });
        Object.defineProperty(window, 'squad', {
            get: function() { return squad; },
            set: function(val) { squad = val; }
        });
        let activeSlotSelection = null; // Current slot being edited in squad builder

        // Initialize Lucide Icons
        lucide.createIcons();

        // --- 4. ON INIT ---
        // Generic helper: wire up all custom-dropdown chips
        function initCustomDropdowns() {
            const allDropdownChips = document.querySelectorAll('.filter-chip.custom-dropdown, .form-group.custom-dropdown');
            allDropdownChips.forEach(chip => {
                if (chip.dataset.dropdownInitialized) return;
                chip.dataset.dropdownInitialized = "true";
                
                const menu = chip.querySelector('.custom-dropdown-menu');
                if (!menu) return;
                chip.addEventListener('click', (e) => {
                    // Close all others first
                    document.querySelectorAll('.custom-dropdown-menu.show').forEach(m => {
                        if (m !== menu) m.classList.remove('show');
                    });
                    const isShowing = menu.classList.toggle('show');
                    if (isShowing && typeof repositionDropdownMenu === 'function') {
                        repositionDropdownMenu(menu);
                    }
                    e.stopPropagation();
                });
            });
            if (!window.documentClickBound) {
                document.addEventListener('click', () => {
                    document.querySelectorAll('.custom-dropdown-menu.show').forEach(m => m.classList.remove('show'));
                });
                window.documentClickBound = true;
            }
        }

        // Generic select for any simple custom dropdown
        function selectCustomValue(hiddenId, triggerId, menuId, value, label) {
            document.getElementById(hiddenId).value = value;
            document.getElementById(triggerId).innerHTML = label || value || 'All';
            const menu = document.getElementById(menuId);
            if (menu) menu.classList.remove('show');
        }

        function exportDatabaseFile() {
            try {
                const fileContent = `// --- FOOTBALL CARD LIBRARY DATABASE & STATIC CONFIGURATIONS ---

const LEAGUES_DATA = ${JSON.stringify(LEAGUES_DATA, null, 4)};

const CONFEDERATIONS = ${JSON.stringify(CONFEDERATIONS, null, 4)};

const COUNTRY_FLAGS = ${JSON.stringify(COUNTRY_FLAGS, null, 4)};

const COUNTRY_CODES = ${JSON.stringify(COUNTRY_CODES, null, 4)};

const SOFIFA_IDS = ${JSON.stringify(SOFIFA_IDS, null, 4)};

const DEFAULT_PLAYERS = ${JSON.stringify(players, null, 4)};

const FORMATIONS = ${JSON.stringify(FORMATIONS, null, 4)};
`;

                const blob = new Blob([fileContent], { type: 'text/javascript;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', 'football_data.js');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast("Đã tạo file football_data.js mới để tải xuống!");
            } catch (err) {
                console.error('Lỗi khi xuất file database:', err);
                alert('Không thể xuất file database.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDatabase();
            // Render the visible library cards first for fast first paint
            applyFilters();

            requestAnimationFrame(() => {
                buildPitch();
                updateSquadStats();
                buildStaticDropdowns();
                populateFormDropdowns();
                initCustomDropdowns();
                buildFormationDropdown();
            });
        });

        // Helper: build a flat list dropdown from an array of {value, label}
        function buildSimpleDropdown(menuId, items, onSelect) {
            const menu = document.getElementById(menuId);
            if (!menu) return;
            menu.innerHTML = '';
            
            // Check if any item has an icon (to align text columns)
            const hasIcons = items.some(item => item.icon !== undefined);
            
            items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'custom-dropdown-item';
                
                if (hasIcons) {
                    const isSvg = item.icon && item.icon.trim().startsWith('<svg');
                    const iconHTML = isSvg 
                        ? item.icon 
                        : `<span style="font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; font-size: 1.1rem;">${item.icon || ''}</span>`;
                    
                    el.innerHTML = `
                        <div style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0;">
                            ${iconHTML}
                        </div>
                        <span style="flex-grow: 1;">${item.label}</span>
                    `;
                } else {
                    el.innerHTML = `<span style="flex-grow: 1;">${item.label}</span>`;
                }
                
                el.onclick = (e) => {
                    e.stopPropagation();
                    const fullLabel = item.icon ? `${item.icon} ${item.label}`.trim() : item.label;
                    onSelect(item.value, fullLabel);
                };
                menu.appendChild(el);
            });
        }

        function saveDatabase() {
            // Auto-migration step to fill missing league fields on legacy cards
            let updated = false;
            players.forEach(p => {
                if (!p.league && p.cardTheme !== 'icons' && p.cardTheme !== 'mm' && p.cardTheme !== 'vnlegends') {
                    for (const [leagueName, data] of Object.entries(LEAGUES_DATA)) {
                        if (data.clubs.includes(p.club)) {
                            p.league = leagueName;
                            updated = true;
                            break;
                        }
                    }
                    if (!p.league) {
                        p.league = "Premier League";
                        updated = true;
                    }
                }
            });

            localStorage.setItem('pitchdeck_players', JSON.stringify(players));
            localStorage.setItem('pitchdeck_squad', JSON.stringify(squad));
            populateFilters();
        }

        // Dynamically populate search options based on database contents
        function populateFilters() {
            const currentLeague = document.getElementById('filter-league').value;

            // Helper to select league
            function selectCustomLeague(val) {
                selectCustomValue('filter-league', 'league-trigger-val', 'league-dropdown-menu', val, val || 'All');
                onLeagueChange();
            }

            // Build league custom dropdown grouped by Confederation (Custom Dropdown with hover submenu)
            const leagueDropdownMenu = document.getElementById('league-dropdown-menu');
            if (leagueDropdownMenu) {
                leagueDropdownMenu.innerHTML = '';

                // 1. Add "All" option
                const allOpt = document.createElement('div');
                allOpt.className = 'custom-dropdown-item';
                allOpt.textContent = 'All';
                allOpt.onclick = (e) => {
                    e.stopPropagation();
                    selectCustomLeague('');
                };
                leagueDropdownMenu.appendChild(allOpt);

                // 2. Group leagues by Confederation
                const leagueGrouped = {
                    "UEFA": [],
                    "CONMEBOL": [],
                    "CONCACAF": [],
                    "AFC": [],
                    "CAF": [],
                    "OFC": [],
                    "Khác": []
                };

                Object.keys(LEAGUES_DATA).forEach(l => {
                    const conf = getLeagueConfederation(l);
                    if (leagueGrouped[conf]) {
                        leagueGrouped[conf].push(l);
                    } else {
                        leagueGrouped["Khác"].push(l);
                    }
                });

                // 3. Render Confederation folders with nested submenus
                const confOrder = ["UEFA", "CONMEBOL", "CONCACAF", "AFC", "CAF", "OFC", "Khác"];
                confOrder.forEach(conf => {
                    const list = leagueGrouped[conf];
                    if (list && list.length > 0) {

        // Extract short names or handle special name cases (Haaland, De Bruyne, D. Doué, G. Doué, etc.)
        function getShortName(fullName) {
            const nameLower = fullName.toLowerCase().trim();
            if (nameLower.includes("de bruyne")) return "De Bruyne";
            if (nameLower.includes("van dijk")) return "Van Dijk";
            if (nameLower.includes("c. ronaldo") || nameLower.includes("cristiano ronaldo")) return "Ronaldo";
            if (nameLower.includes("d. doué") || nameLower.includes("d. doue")) return "D. Doué";
            if (nameLower.includes("g. doué") || nameLower.includes("g. doue")) return "G. Doué";
            if (nameLower.includes("désiré doué") || nameLower.includes("desire doue")) return "D. Doué";
            if (nameLower.includes("guela doué") || nameLower.includes("guela doue")) return "G. Doué";

            const parts = fullName.trim().split(/\s+/);
            if (parts.length <= 1) return fullName;
            return parts[parts.length - 1]; // Default return last word (last name)
        }

        // --- 6. RENDER CASUAL CARDS ---
        function getCardThemeClass(p) {
            if (p && p.cardTheme === 'worldcup26') return 'card-wc26';
            if (p && p.cardTheme === 'icons') return 'card-icons';
            if (p && p.cardTheme === 'mm') return 'card-mm';
            if (p && p.cardTheme === 'toty') return 'card-toty';
            if (p && p.cardTheme === 'ucl') return 'card-ucl';
            if (p && p.cardTheme === 'vnlegends') return 'card-vnlegends';
            if (p && p.cardTheme === 'gc') return 'card-gc';
            const rating = (p && p.rating) || p || 0;
            if (rating >= 90) return 'card-icon';
            if (rating >= 80) return 'card-gold';
            if (rating >= 70) return 'card-silver';
            return 'card-bronze';
        }

        function getCardThemeIcon(p) {
            if (p.cardTheme === 'worldcup26') return '🏆';
            if (p.cardTheme === 'icons') return '★';
            if (p.cardTheme === 'mm') return '✦';
            if (p.cardTheme === 'toty') return '❄';
            if (p.cardTheme === 'ucl') return '✦';
            if (p.cardTheme === 'vnlegends') return '★';
            if (p.cardTheme === 'gc') return '👑';
            
            const themeClass = getCardThemeClass(p);
            if (themeClass === 'card-icon') return '💎';
            if (themeClass === 'card-gold') return '★';
            if (themeClass === 'card-silver') return '☆';
            return '•';
        }

        // Apply 3D Tilt Effect to rendered card elements
        // Single delegated tilt handler — no per-card listeners, runs once per grid render
        let _tiltGridAttached = false;
        function initCardTiltEffects() {
            if (_tiltGridAttached) return;
            const grid = document.getElementById('player-grid');
            if (!grid) return;
            _tiltGridAttached = true;

            grid.addEventListener('mousemove', e => {
                const card = e.target.closest('.player-card');
                if (!card) return;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const angleX = (rect.height / 2 - y) / 7;
                const angleY = (x - rect.width / 2) / 7;
                card.style.transition = 'none';
                card.style.transform = `perspective(900px) rotateX(${angleX}deg) rotateY(${angleY}deg) scale(1.03)`;
            });

            grid.addEventListener('mouseleave', e => {
                const card = e.target.closest('.player-card');
                if (!card) return;
                card.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
                card.style.transform = '';
            }, true);
        }

        // --- 7. SEARCH, FILTER, SORT ---
        function removeDiacritics(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
        }

        function applyFilters() {
            const queryRaw = document.getElementById('search-input').value.toLowerCase().trim();
            const queryNormalized = removeDiacritics(queryRaw);
            const leagueFilter = document.getElementById('filter-league').value;
            const clubFilter = document.getElementById('filter-club').value;
            const nationFilter = document.getElementById('filter-nation').value;
            const posFilter = document.getElementById('filter-position').value;
            const sortBy = document.getElementById('sort-by').value;

            let filtered = [...players];

            // Filter by search query (name)
            if (queryNormalized) {
                filtered = filtered.filter(p => {
                    const fullNameClean = removeDiacritics((p.name || '').toLowerCase());
                    const cardNameClean = removeDiacritics((p.cardName || '').toLowerCase());
                    return fullNameClean.includes(queryNormalized) || cardNameClean.includes(queryNormalized);
                });
            }

            // Filter by league selection
            if (leagueFilter) {
                filtered = filtered.filter(p => p.league === leagueFilter);
            }

            // Filter by club selection
            if (clubFilter) {
                filtered = filtered.filter(p => p.club === clubFilter);
            }

            // Filter by nationality selection
            if (nationFilter) {
                filtered = filtered.filter(p => p.nationality === nationFilter);
            }

            // Filter by card theme/season
            const themeFilter = document.getElementById('filter-theme').value;
            if (themeFilter) {
                filtered = filtered.filter(p => (p.cardTheme || 'standard') === themeFilter);
            }

            // Filter by position categories (check main position or any alt position)
            if (posFilter) {
                filtered = filtered.filter(p => {
                    const allPos = [p.position, ...(p.altPositions || [])];
                    if (posFilter === 'GK') {
                        return allPos.includes('GK');
                    } else if (posFilter === 'FW') {
                        const targetPositions = ['ST', 'CF', 'LW', 'RW'];
                        return allPos.some(pos => targetPositions.includes(pos));
                    } else if (posFilter === 'MF') {
                        const targetPositions = ['CAM', 'CM', 'CDM', 'LM', 'RM'];
                        return allPos.some(pos => targetPositions.includes(pos));
                    } else if (posFilter === 'DF') {
                        const targetPositions = ['CB', 'LB', 'RB', 'LWB', 'RWB'];
                        return allPos.some(pos => targetPositions.includes(pos));
                    }
                    return false;
                });
            }

            // Sort logic
            filtered.sort((a, b) => {
                if (sortBy === 'rating-desc') return b.rating - a.rating;
                if (sortBy === 'rating-asc') return a.rating - b.rating;
                if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
                if (sortBy === 'pos-gk-fw') {
                    return (getPositionRank(a.position) - getPositionRank(b.position)) || (b.rating - a.rating);
                }
                if (sortBy === 'pos-fw-gk') {
                    return (getPositionRank(b.position) - getPositionRank(a.position)) || (b.rating - a.rating);
                }
                return 0;
            });

            // Render output
            const grid = document.getElementById('player-grid');
            displayedPlayers = filtered;
            renderLimit = BATCH_SIZE;

            if (displayedPlayers.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i data-lucide="info"></i>
                        <h3>Không tìm thấy cầu thủ nào</h3>
                        <p>Hãy thử thay đổi điều kiện tìm kiếm hoặc bộ lọc.</p>
                    </div>
                `;
            } else {
                const initialBatch = displayedPlayers.slice(0, BATCH_SIZE);
                grid.innerHTML = initialBatch.map(p => createPlayerCardHTML(p)).join('');
            }

            // Update filter count box next to "Xóa lọc"
            const countBox = document.getElementById('filter-count-box');
            const countNum = document.getElementById('filter-count-num');
            if (countBox && countNum) {
                const queryRaw = document.getElementById('search-input').value.toLowerCase().trim();
                const leagueFilter = document.getElementById('filter-league').value;
                const clubFilter = document.getElementById('filter-club').value;
                const nationFilter = document.getElementById('filter-nation').value;
                const posFilter = document.getElementById('filter-position').value;
                const themeFilter = document.getElementById('filter-theme').value;
                const isFilterActive = queryRaw || leagueFilter || clubFilter || nationFilter || posFilter || themeFilter;

                if (isFilterActive) {
                    countNum.textContent = filtered.length;
                    countBox.style.display = 'flex';
                } else {
                    countBox.style.display = 'none';
                }
            }

            updateChipActiveStates();
            // Run lucide scan and tilt init after paint to avoid blocking render
            requestAnimationFrame(() => {
                lucide.createIcons();
                initCardTiltEffects();
            });
        }

        // Global variables for batch loading in library tab
        let displayedPlayers = [];
        let renderLimit = 60;
        const BATCH_SIZE = 60;

        function renderNextBatch() {
            if (renderLimit >= displayedPlayers.length) return;
            const grid = document.getElementById('player-grid');
            const nextBatch = displayedPlayers.slice(renderLimit, renderLimit + BATCH_SIZE);
            if (nextBatch.length === 0) return;

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = nextBatch.map(p => createPlayerCardHTML(p)).join('');
            
            while (tempDiv.firstChild) {
                grid.appendChild(tempDiv.firstChild);
            }
            
            renderLimit += BATCH_SIZE;
            requestAnimationFrame(() => lucide.createIcons());
        }

            if (libraryTab && libraryTab.classList.contains('active')) {

                    renderNextBatch();
                }
            }
        });

        function savePlayer(e) {
            e.preventDefault();
            const id = document.getElementById('player-id').value;
            const name = document.getElementById('player-name').value;
            const cardName = document.getElementById('player-card-name').value.trim();
            const nationality = document.getElementById('player-nation').value;
            const flag = document.getElementById('player-flag').value;
            const league = document.getElementById('player-league').value;

            const rating = parseInt(document.getElementById('player-rating').value);
            const photo = document.getElementById('player-photo').value;
            const cardTheme = document.getElementById('player-theme').value;

            const altPositions = Array.from(
                document.querySelectorAll('#alt-positions-grid input:checked')
            ).map(cb => cb.value);

            const playerData = {
                id: id || 'player-' + Date.now(),
                name, cardName, nationality, flag, league, club, position, altPositions, rating, photo, cardTheme
            };

            if (id) {
                const idx = players.findIndex(x => x.id === id);
                if (idx !== -1) players[idx] = playerData;
                showToast(`Đã cập nhật ${cardName || getShortName(name)}`);

                // Update card directly in the DOM if it exists to avoid scroll jumping
                const cardEl = document.getElementById(`card-${playerData.id}`);
                if (cardEl) {
                    const wrapper = cardEl.parentElement;
                    if (wrapper) {
                        wrapper.outerHTML = createPlayerCardHTML(playerData);
                        lucide.createIcons();
                        initCardTiltEffects();
                    }
                } else {
                    applyFilters();
                }

                // If player is on the squad pitch, rebuild pitch
                if (Object.values(squad).includes(playerData.id)) {
                    buildPitch();
                    updateSquadStats();
                }
            } else {
                players.push(playerData);
                showToast(`Đã thêm ${cardName || getShortName(name)} thành công`);
                applyFilters();
            }
            saveDatabase();
            closeDrawer();
        }

        function deletePlayer(id) {
            const p = players.find(x => x.id === id);
            if (!p) return;

            if (confirm(`Bạn có chắc chắn muốn xóa vĩnh viễn thẻ cầu thủ ${p.name}?`)) {
                players = players.filter(x => x.id !== id);
                
                for (let key in squad) {
                    if (squad[key] === id) {
                        delete squad[key];
                    }

                saveDatabase();

                // Remove card directly from the DOM if it exists
                const cardEl = document.getElementById(`card-${id}`);
                if (cardEl) {
                    const wrapper = cardEl.parentElement;
                    if (wrapper) {
                        wrapper.remove();

                buildPitch();
                updateSquadStats();
                showToast(`Đã xóa cầu thủ ${p.cardName || getShortName(p.name)}`);
            }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        const isValid = imported.every(p => p.id && p.name && p.rating);
                        if (isValid) {
                            // Merge imported players with existing database by ID
                            imported.forEach(imp => {
                                const idx = players.findIndex(p => p.id === imp.id);
                                if (idx !== -1) {
                                    players[idx] = imp;
                                } else {
                                    players.push(imp);
                                }
                            });
                            saveDatabase();
                            applyFilters();
                            showToast(`Nhập dữ liệu thành công! Đã gộp thêm ${imported.length} cầu thủ.`);
                        } else {
                            alert("Định dạng file JSON không đúng cấu trúc cầu thủ!");
                        }
                    } else {
                        alert("File JSON phải chứa một mảng danh sách cầu thủ!");
                    }
                } catch(err) {
                    alert("Lỗi khi đọc file JSON: " + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Drag and Drop State & Event Handlers for Squad Builder
        let draggedSlotSource = null;

        function handleDragStart(e) {
            draggedSlotSource = e.currentTarget.getAttribute('data-slot');
            e.currentTarget.classList.add('dragging');
            
            // Set drag data transfer
            e.dataTransfer.setData('text/plain', draggedSlotSource);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.pitch-slot').forEach(s => s.classList.remove('drag-over', 'drag-invalid'));
            draggedSlotSource = null;
        }

        function handleDragOver(e) {
            if (!draggedSlotSource) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            if (!draggedSlotSource) return;
            const destSlot = e.currentTarget.getAttribute('data-slot');
            if (isValidSwap(draggedSlotSource, destSlot)) {
                e.currentTarget.classList.add('drag-over');
            } else if (draggedSlotSource !== destSlot) {
                e.currentTarget.classList.add('drag-invalid');
            }
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over', 'drag-invalid');
        }

        function handleDrop(e) {
            if (!draggedSlotSource) return;
            e.preventDefault();
            const destSlot = e.currentTarget.getAttribute('data-slot');
            
            if (isValidSwap(draggedSlotSource, destSlot)) {
                const srcPlayerId = squad[draggedSlotSource];
                const destPlayerId = squad[destSlot];
                
                if (destPlayerId) {
                    squad[draggedSlotSource] = destPlayerId;
                } else {
                    delete squad[draggedSlotSource];
                }
                squad[destSlot] = srcPlayerId;
                
                saveDatabase();
                buildPitch();
                updateSquadStats();
                showToast(`Đã chuyển cầu thủ sang vị trí ${getDisplayPos(destSlot)}.`);
            } else {
                if (draggedSlotSource !== destSlot) {
                    showToast("Cầu thủ không tương thích vị trí hoặc không thể tráo đổi!");
                }
            }
            
            document.querySelectorAll('.pitch-slot').forEach(s => s.classList.remove('drag-over', 'drag-invalid'));
            draggedSlotSource = null;
        }

        function isValidSwap(srcSlot, destSlot) {
            if (srcSlot === destSlot) return false;
            
            const srcPlayerId = squad[srcSlot];
            const destPlayerId = squad[destSlot];
            
            if (!srcPlayerId) return false;
            
            const srcPlayer = players.find(x => x.id === srcPlayerId);
            if (!srcPlayer) return false;
            
            // Check if source player is compatible with destination slot
            if (!isCompatiblePosition(destSlot, srcPlayer.position, srcPlayer.altPositions)) {
                return false;
            }
            
            // If destSlot is occupied, check if destination player is compatible with source slot
            if (destPlayerId) {
                const destPlayer = players.find(x => x.id === destPlayerId);
                if (!destPlayer) return false;
                if (!isCompatiblePosition(srcSlot, destPlayer.position, destPlayer.altPositions)) {
                    return false;
                }
            }
            
            return true;
        }

        // --- 10. SQUAD BUILDER PITCH LOGIC ---
        function buildPitch() {
            const pitch = document.getElementById('football-pitch');
            const formationVal = document.getElementById('formation-select').value;
            const slotsData = FORMATIONS[formationVal];

            const oldSlots = pitch.querySelectorAll('.pitch-slot');
            oldSlots.forEach(s => s.remove());

            for (let slotPos in slotsData) {
                const coord = slotsData[slotPos];
                const slotDiv = document.createElement('div');
                slotDiv.className = 'pitch-slot';
                // On mobile portrait, use vertical pitch layout (GK at bottom, FW at top)
                // FORMATIONS data: coord.left = horizontal %, coord.bottom = vertical % from bottom
                const isMobilePortrait = window.matchMedia('(max-width: 768px) and (orientation: portrait)').matches;
                if (isMobilePortrait) {
                    // Vertical pitch: left stays horizontal, top = 100% - bottom (flip so GK bottom)
                    slotDiv.style.left = coord.left;
                    slotDiv.style.top = (100 - parseFloat(coord.bottom)) + '%';
                } else {
                    // Horizontal pitch (default desktop): swap axes
                    slotDiv.style.left = coord.bottom;
                    slotDiv.style.top = coord.left;
                }
                
                // Drag and drop event listeners setup
                slotDiv.setAttribute('data-slot', slotPos);
                slotDiv.addEventListener('dragover', handleDragOver);
                slotDiv.addEventListener('dragenter', handleDragEnter);
                slotDiv.addEventListener('dragleave', handleDragLeave);
                slotDiv.addEventListener('drop', handleDrop);

                const playerId = squad[slotPos];
                const player = players.find(x => x.id === playerId);

                if (player) {
                    // Make occupied slots draggable
                    slotDiv.setAttribute('draggable', 'true');
                    slotDiv.addEventListener('dragstart', handleDragStart);
                    slotDiv.addEventListener('dragend', handleDragEnd);
                    
                    const themeClass = getCardThemeClass(player);
                    const displayName = player.cardName || getShortName(player.name);
                    const isIcons = player.cardTheme === 'icons';
                    const isMM = player.cardTheme === 'mm';
                    const isTOTY = player.cardTheme === 'toty';
                    const isUCL = player.cardTheme === 'ucl';
                    const isVNLegends = player.cardTheme === 'vnlegends';
                    const isGC = player.cardTheme === 'gc';

                    let photoHTML;
                    if (player.photo) {
                        photoHTML = `<img src="${player.photo}" alt="${player.name}">`;
                    } else {
                        photoHTML = `<svg class="panini-photo-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                    }

                    const flagHTML = getFlagImgHTML(player.nationality, player.flag);

                    const footerHTML = isIcons
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">★ ICONS ★</div>`
                        : isMM
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">✦ MEMOIR ✦</div>`
                        : isTOTY
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">❄ TOTY 26 ❄</div>`
                        : isUCL
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">✦ UCL HERO ✦</div>`
                        : isVNLegends
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">★ VIETNAM LEGENDS ★</div>`
                        : `<div class="panini-name">${displayName}</div>
                           <div class="panini-club">${player.club || ''}</div>`;

                    slotDiv.innerHTML = `
                        <div class="pitch-player-card-container" onclick="openSquadSelector('${slotPos}')">
                            <button class="mini-remove-btn" onclick="event.stopPropagation(); removePlayerFromSlot('${slotPos}')">×</button>
                            <div class="player-card ${themeClass}">
                                <div class="panini-band">

        function getRandomPlayerForSlot(slotPos, selectedIds) {
            // Lọc ra các cầu thủ có ảnh, tương thích vị trí và chưa được chọn trong đội hình
            let available = players.filter(p => {
                if (selectedIds.includes(p.id)) return false;
                return !!p.photo && isCompatiblePosition(slotPos, p.position, p.altPositions);
            });

            if (available.length === 0) return null;

            // Tính trọng số (khớp vị trí chính được 1.5, vị trí phụ được 1.0)
            const weights = available.map(p => {
                const mapping = {
                    "GK": ["GK"], "LB": ["LB", "LWB"], "RB": ["RB", "RWB"],
                    "LWB": ["LWB", "LB"], "RWB": ["RWB", "RB"], "CB": ["CB"],
                    "LCB": ["CB"], "RCB": ["CB"], "CDM": ["CDM"],
                    "LDM": ["CDM"], "RDM": ["CDM"], "LCDM": ["CDM"], "RCDM": ["CDM"],
                    "CM": ["CM"], "LCM": ["CM"], "RCM": ["CM"], "LM": ["LM", "LW"],
                    "RM": ["RM", "RW"], "CAM": ["CAM"], "CAM1": ["CAM", "CF"],
                    "CAM2": ["CAM", "CF"], "LCAM": ["CAM", "CF"], "RCAM": ["CAM", "CF"],
                    "LW": ["LW", "LM"], "RW": ["RW", "RM"],
                    "ST": ["ST", "CF"], "LST": ["ST", "CF"], "RST": ["ST", "CF"],
                    "ST1": ["ST", "CF"], "ST2": ["ST", "CF"], "CF1": ["CF", "ST"],
                    "CF2": ["CF", "ST"]
                };
                const targets = mapping[slotPos] || [slotPos];
                const isPrimaryMatch = targets[0] === p.position;
                return isPrimaryMatch ? 1.5 : 1.0;
            });

            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            let randomValue = Math.random() * totalWeight;
            
            for (let i = 0; i < available.length; i++) {
                randomValue -= weights[i];
                if (randomValue <= 0) return available[i];
            }
            return available[0];
        }

        function randomizeSquad() {
            if (players.length === 0) {
                showToast("Không có cầu thủ nào trong thư viện để tạo đội hình!");
                return;
            }
            const formationVal = document.getElementById('formation-select').value;
            const slotsData = FORMATIONS[formationVal];
            
            let tempSquad = {};
            let selectedIds = [];
            
            // GK luôn bốc trước để đảm bảo vị trí đặc biệt này không bị thiếu cầu thủ
            const slotKeys = Object.keys(slotsData);
            slotKeys.sort((a, b) => {
                const isAGK = a.startsWith("GK");
                const isBGK = b.startsWith("GK");
                if (isAGK && !isBGK) return -1;
                if (!isAGK && isBGK) return 1;
                return 0;
            });

            let skippedSlots = [];
            for (let slotPos of slotKeys) {
                const player = getRandomPlayerForSlot(slotPos, selectedIds);
                if (player) {
                    tempSquad[slotPos] = player.id;
                    selectedIds.push(player.id);
                } else {
                    skippedSlots.push(getDisplayPos(slotPos));
                }
            }

            squad = tempSquad;
            saveDatabase();
            buildPitch();
            updateSquadStats();
            
            if (skippedSlots.length > 0) {
                showToast(`Đã random đội hình! Không tìm thấy đủ cầu thủ có ảnh & đúng vị trí cho: ${skippedSlots.join(', ')}.`);
            } else {
                showToast("Đã random ngẫu nhiên toàn bộ đội hình theo đúng vị trí và có ảnh!");
            }
        }

        function selectRandomPlayerForActiveSlot() {
            if (!activeSlotSelection) return;

            const selectedIds = Object.values(squad);
            
            // Limit to players matching the position (primary or alt), having a photo, and not already in other slots
            let available = players.filter(p => {
                if (selectedIds.includes(p.id) && squad[activeSlotSelection] !== p.id) {
                    return false;
                }
                return !!p.photo && isCompatiblePosition(activeSlotSelection, p.position, p.altPositions);
            });

            if (available.length === 0) {
                showToast(`Không có cầu thủ nào phù hợp cho vị trí ${getDisplayPos(activeSlotSelection)}.`);
                return;
            }

            // Assign weights: primary position matches get 1.5x, alternative matches get 1.0x
            const weights = available.map(p => {
                const mapping = {
                    "GK": ["GK"], "LB": ["LB", "LWB"], "RB": ["RB", "RWB"],
                    "LWB": ["LWB", "LB"], "RWB": ["RWB", "RB"], "CB": ["CB"],
                    "LCB": ["CB"], "RCB": ["CB"], "CDM": ["CDM"],
                    "LDM": ["CDM"], "RDM": ["CDM"], "CM": ["CM"],
                    "LCM": ["CM"], "RCM": ["CM"], "LM": ["LM", "LW"],
                    "RM": ["RM", "RW"], "CAM": ["CAM"], "CAM1": ["CAM", "CF"],
                    "CAM2": ["CAM", "CF"], "LW": ["LW", "LM"], "RW": ["RW", "RM"],
                    "ST": ["ST", "CF"], "LST": ["ST", "CF"], "RST": ["ST", "CF"],
                    "ST1": ["ST", "CF"], "ST2": ["ST", "CF"], "CF1": ["CF", "ST"],
                    "CF2": ["CF", "ST"]
                };
                const targets = mapping[activeSlotSelection] || [activeSlotSelection];
                const isPrimaryMatch = targets[0] === p.position;
                return isPrimaryMatch ? 1.5 : 1.0;
            });

            // Cumulative sum of weights
            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            let randomValue = Math.random() * totalWeight;
            
            let selectedPlayer = available[0];
            for (let i = 0; i < available.length; i++) {
                randomValue -= weights[i];
                if (randomValue <= 0) {
                    selectedPlayer = available[i];
                    break;
                }
            }
            
            selectPlayerForSlot(selectedPlayer.id);
        }

        // --- SQUAD RATING & CHEMISTRY CALCULATOR ---
        function updateSquadStats() {
            const formationVal = document.getElementById('formation-select').value;
            const slots = Object.keys(FORMATIONS[formationVal]);
            
            let totalRating = 0;
            let count = 0;
            let activePlayersOnPitch = [];

            // Zone accumulators
            let defTotal = 0, defCount = 0;
            let midTotal = 0, midCount = 0;
            let atkTotal = 0, atkCount = 0;

            slots.forEach(slot => {
                const pid = squad[slot];
                const player = players.find(x => x.id === pid);
                if (player) {
                    totalRating += player.rating;
                    count++;
                    activePlayersOnPitch.push({ player, slot });

                    // Classify by slot position key
                    const s = slot.toUpperCase();
                    if (s.includes('GK') || s.includes('CB') || s.includes('LB') || s.includes('RB') || s.includes('LWB') || s.includes('RWB') || s.includes('DF')) {
                        defTotal += player.rating; defCount++;
                    } else if (s.includes('ST') || s.includes('LW') || s.includes('RW') || s.includes('CF') || s.includes('SS')) {
                        atkTotal += player.rating; atkCount++;
                    } else {
                        // CM, CAM, CDM, DM, LM, RM → MID
                        midTotal += player.rating; midCount++;
                    }
                }
            });

            // Team OVR
            const teamOvr = count > 0 ? Math.round(totalRating / count) : 0;
            document.getElementById('team-rating').textContent = teamOvr.toString().padStart(2, '0');

            // Zone OVR
            document.getElementById('zone-def').textContent = defCount > 0 ? Math.round(defTotal / defCount) : '--';
            document.getElementById('zone-mid').textContent = midCount > 0 ? Math.round(midTotal / midCount) : '--';
            document.getElementById('zone-atk').textContent = atkCount > 0 ? Math.round(atkTotal / atkCount) : '--';

            // Chemistry
            let totalChem = 0;
            activePlayersOnPitch.forEach(item => {
                let pChem = 0;
                const p = item.player;
                const slot = item.slot;

                let posMatch = false;
                if (slot.includes("GK") && p.position === "GK") posMatch = true;
                else if ((slot.includes("ST") || slot.includes("LW") || slot.includes("RW")) && ["ST", "CF", "LW", "RW"].includes(p.position)) posMatch = true;
                else if ((slot.includes("CM") || slot.includes("DM") || slot.includes("CAM")) && ["CM", "CDM", "CAM"].includes(p.position)) posMatch = true;
                else if ((slot.includes("LM") || slot.includes("RM")) && ["LM", "RM", "LW", "RW"].includes(p.position)) posMatch = true;
                else if ((slot.includes("CB") || slot.includes("DF")) && p.position === "CB") posMatch = true;
                else if ((slot.includes("LB") || slot.includes("RB")) && ["LB", "RB", "CB"].includes(p.position)) posMatch = true;

                if (posMatch) pChem += 1;

                const sameClubCount = activePlayersOnPitch.filter(x => x.player.id !== p.id && x.player.club === p.club).length;
                if (sameClubCount >= 2) pChem += 1;
                else if (sameClubCount >= 1 && pChem < 2) pChem += 1;

                const sameNationCount = activePlayersOnPitch.filter(x => x.player.id !== p.id && x.player.nationality === p.nationality).length;
                if (sameNationCount >= 2) pChem += 1;
                else if (sameNationCount >= 1 && pChem < 3) pChem += 1;

                totalChem += Math.min(3, pChem);
            });

            const maxPossibleChem = count * 3;
            const chemEl = document.getElementById('team-chemistry');
            const chemBar = document.getElementById('chem-bar-fill');
            chemEl.textContent = `${totalChem}/${maxPossibleChem}`;

            const chemPct = maxPossibleChem > 0 ? (totalChem / maxPossibleChem) * 100 : 0;
            if (chemBar) chemBar.style.width = chemPct + '%';

            let chemColor = 'var(--text-muted)';
            let barColor = 'rgba(255,255,255,0.2)';
            if (count === 11) {
                if (totalChem >= 28) {
                    chemColor = 'var(--accent)';
                    barColor = 'var(--accent)';
                } else if (totalChem >= 15) {
                    chemColor = '#e5a93b';
                    barColor = '#e5a93b';
                } else {
                    chemColor = '#ef4444';
                    barColor = '#ef4444';
                }
            }
            chemEl.style.color = chemColor;
            if (chemBar) chemBar.style.background = barColor;
        }

        function repositionDropdownMenu(menu) {
            if (window.innerWidth > 768) return; // Only needed on mobile
            // Reset to default so we can measure
            menu.style.left = '';
            menu.style.right = '';
            menu.style.top = '';
            menu.style.position = 'fixed';

            const trigger = menu.closest('.filter-chip, .form-group');
            if (!trigger) return;
            const rect = trigger.getBoundingClientRect();
            const menuW = Math.min(280, window.innerWidth - 16);

            let left = rect.left;
            if (left + menuW > window.innerWidth - 8) {
                left = window.innerWidth - menuW - 8;
            }
            if (left < 8) left = 8;

            menu.style.left = left + 'px';
            menu.style.top = (rect.bottom + 6) + 'px';
            menu.style.width = menuW + 'px';
            menu.style.maxWidth = menuW + 'px';

        function renderEndedStage(sim, container) {

                            goalsHome: pair.goalsHome,

            function addKnockout(matchesList, stageName) {
                if (!matchesList) return;
                matchesList.forEach(matchObj => {
                    if (matchObj.homeLeg1.isUser || matchObj.awayLeg1.isUser) {
                        userMatches.push({
                            stageName: `${stageName} (Lượt đi)`,
                            home: matchObj.homeLeg1.name,
                            away: matchObj.awayLeg1.name,
                            goalsHome: matchObj.goalsHome1,
                            goalsAway: matchObj.goalsAway1,
                            isUserHome: matchObj.homeLeg1.isUser,
                            penaltyWinner: null
                        });
                        userMatches.push({
                            stageName: `${stageName} (Lượt về)`,
                            home: matchObj.awayLeg1.name,
                            away: matchObj.homeLeg1.name,
                            goalsHome: matchObj.goalsHome2,
                            goalsAway: matchObj.goalsAway2,
                            isUserHome: matchObj.awayLeg1.isUser,
                            penaltyWinner: matchObj.penaltyWinner

                            outcomeColor = "#ef4444";
