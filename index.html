        // Apply 3D Tilt Effect to rendered card elements
        // Single delegated tilt handler — no per-card listeners, runs once per grid render
        let _tiltGridAttached = false;
        function initCardTiltEffects() {
            if (_tiltGridAttached) return;
            const grid = document.getElementById('player-grid');
            if (!grid) return;
            _tiltGridAttached = true;

            grid.addEventListener('mousemove', e => {
                const card = e.target.closest('.player-card');
                if (!card) return;
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const angleX = (rect.height / 2 - y) / 7;
                const angleY = (x - rect.width / 2) / 7;
                card.style.transition = 'none';
                card.style.transform = `perspective(900px) rotateX(${angleX}deg) rotateY(${angleY}deg) scale(1.03)`;
            });

            grid.addEventListener('mouseleave', e => {
                const card = e.target.closest('.player-card');
                if (!card) return;
                card.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
                card.style.transform = '';
            }, true);
        }

        // --- 7. SEARCH, FILTER, SORT ---
        function removeDiacritics(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D");
        }

        function applyFilters() {
            const queryRaw = document.getElementById('search-input').value.toLowerCase().trim();
            const queryNormalized = removeDiacritics(queryRaw);
            const leagueFilter = document.getElementById('filter-league').value;
            const clubFilter = document.getElementById('filter-club').value;
            const nationFilter = document.getElementById('filter-nation').value;
            const posFilter = document.getElementById('filter-position').value;
            const sortBy = document.getElementById('sort-by').value;

            let filtered = [...players];

            // Filter by search query (name)
            if (queryNormalized) {
                filtered = filtered.filter(p => {
                    const fullNameClean = removeDiacritics((p.name || '').toLowerCase());
                    const cardNameClean = removeDiacritics((p.cardName || '').toLowerCase());
                    return fullNameClean.includes(queryNormalized) || cardNameClean.includes(queryNormalized);
                });
            }

            // Filter by league selection
            if (leagueFilter) {
                filtered = filtered.filter(p => p.league === leagueFilter);
            }

            // Filter by club selection
            if (clubFilter) {
                filtered = filtered.filter(p => p.club === clubFilter);
            }

            // Filter by nationality selection
            if (nationFilter) {
                filtered = filtered.filter(p => p.nationality === nationFilter);
            }

            // Filter by card theme/season
            const themeFilter = document.getElementById('filter-theme').value;
            if (themeFilter) {
                filtered = filtered.filter(p => (p.cardTheme || 'standard') === themeFilter);
            }

            // Filter by position categories (check main position or any alt position)
            if (posFilter) {
                filtered = filtered.filter(p => {
                    const allPos = [p.position, ...(p.altPositions || [])];
                    if (posFilter === 'GK') {
                        return allPos.includes('GK');
                    } else if (posFilter === 'FW') {
                        const targetPositions = ['ST', 'CF', 'LW', 'RW'];
                        return allPos.some(pos => targetPositions.includes(pos));
                    } else if (posFilter === 'MF') {
                        const targetPositions = ['CAM', 'CM', 'CDM', 'LM', 'RM'];
                        return allPos.some(pos => targetPositions.includes(pos));
                    } else if (posFilter === 'DF') {
                        const targetPositions = ['CB', 'LB', 'RB', 'LWB', 'RWB'];
                        return allPos.some(pos => targetPositions.includes(pos));
                    }
                    return false;
                });
            }

            // Sort logic
            filtered.sort((a, b) => {
                if (sortBy === 'rating-desc') return b.rating - a.rating;
                if (sortBy === 'rating-asc') return a.rating - b.rating;
                if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
                if (sortBy === 'pos-gk-fw') {
                    return (getPositionRank(a.position) - getPositionRank(b.position)) || (b.rating - a.rating);
                }
                if (sortBy === 'pos-fw-gk') {
                    return (getPositionRank(b.position) - getPositionRank(a.position)) || (b.rating - a.rating);
                }
                return 0;
            });

            // Render output
            const grid = document.getElementById('player-grid');
            displayedPlayers = filtered;
            renderLimit = BATCH_SIZE;

            if (displayedPlayers.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i data-lucide="info"></i>
                        <h3>Không tìm thấy cầu thủ nào</h3>
                        <p>Hãy thử thay đổi điều kiện tìm kiếm hoặc bộ lọc.</p>
                    </div>
                `;
            } else {
                const initialBatch = displayedPlayers.slice(0, BATCH_SIZE);
                grid.innerHTML = initialBatch.map(p => createPlayerCardHTML(p)).join('');
            }

            updateChipActiveStates();
            // Run lucide scan and tilt init after paint to avoid blocking render
            requestAnimationFrame(() => {
                lucide.createIcons();
                initCardTiltEffects();
            });
        }

        // Global variables for batch loading in library tab
        let displayedPlayers = [];
        let renderLimit = 60;
        const BATCH_SIZE = 60;

        function renderNextBatch() {
            if (renderLimit >= displayedPlayers.length) return;
            const grid = document.getElementById('player-grid');
            const nextBatch = displayedPlayers.slice(renderLimit, renderLimit + BATCH_SIZE);
            if (nextBatch.length === 0) return;

                // If player is on the squad pitch, rebuild pitch

                    buildPitch();
                    updateSquadStats();

                showToast(`Đã thêm ${cardName || getShortName(name)} thành công`);
                applyFilters();

        function deletePlayer(id) {

            if (confirm(`Bạn có chắc chắn muốn xóa vĩnh viễn thẻ cầu thủ ${p.name}?`)) {
                players = players.filter(x => x.id !== id);

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        const isValid = imported.every(p => p.id && p.name && p.rating);
                        if (isValid) {
                            // Merge imported players with existing database by ID
                            imported.forEach(imp => {
                                const idx = players.findIndex(p => p.id === imp.id);
                                if (idx !== -1) {
                                    players[idx] = imp;
                                } else {
                                    players.push(imp);
                                }
                            });
                            saveDatabase();
                            applyFilters();
                            showToast(`Nhập dữ liệu thành công! Đã gộp thêm ${imported.length} cầu thủ.`);
                        } else {
                            alert("Định dạng file JSON không đúng cấu trúc cầu thủ!");
                        }
                    } else {
                        alert("File JSON phải chứa một mảng danh sách cầu thủ!");
                    }
                } catch(err) {
                    alert("Lỗi khi đọc file JSON: " + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // Drag and Drop State & Event Handlers for Squad Builder
        let draggedSlotSource = null;

        function handleDragStart(e) {
            draggedSlotSource = e.currentTarget.getAttribute('data-slot');
            e.currentTarget.classList.add('dragging');
            
            // Set drag data transfer
            e.dataTransfer.setData('text/plain', draggedSlotSource);
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.pitch-slot').forEach(s => s.classList.remove('drag-over', 'drag-invalid'));
            draggedSlotSource = null;
        }

        function handleDragOver(e) {
            if (!draggedSlotSource) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            if (!draggedSlotSource) return;
            const destSlot = e.currentTarget.getAttribute('data-slot');
            if (isValidSwap(draggedSlotSource, destSlot)) {
                e.currentTarget.classList.add('drag-over');
            } else if (draggedSlotSource !== destSlot) {
                e.currentTarget.classList.add('drag-invalid');
            }
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over', 'drag-invalid');
        }

        function handleDrop(e) {
            if (!draggedSlotSource) return;
            e.preventDefault();
            const destSlot = e.currentTarget.getAttribute('data-slot');
            
            if (isValidSwap(draggedSlotSource, destSlot)) {
                const srcPlayerId = squad[draggedSlotSource];
                const destPlayerId = squad[destSlot];
                
                if (destPlayerId) {
                    squad[draggedSlotSource] = destPlayerId;
                } else {
                    delete squad[draggedSlotSource];
                }
                squad[destSlot] = srcPlayerId;
                
                saveDatabase();
                buildPitch();
                updateSquadStats();
                showToast(`Đã chuyển cầu thủ sang vị trí ${getDisplayPos(destSlot)}.`);
            } else {
                if (draggedSlotSource !== destSlot) {
                    showToast("Cầu thủ không tương thích vị trí hoặc không thể tráo đổi!");
                }
            }
            
            document.querySelectorAll('.pitch-slot').forEach(s => s.classList.remove('drag-over', 'drag-invalid'));
            draggedSlotSource = null;
        }

        function isValidSwap(srcSlot, destSlot) {
            if (srcSlot === destSlot) return false;
            
            const srcPlayerId = squad[srcSlot];
            const destPlayerId = squad[destSlot];
            
            if (!srcPlayerId) return false;
            
            const srcPlayer = players.find(x => x.id === srcPlayerId);
            if (!srcPlayer) return false;
            
            // Check if source player is compatible with destination slot
            if (!isCompatiblePosition(destSlot, srcPlayer.position, srcPlayer.altPositions)) {
                return false;
            }
            
            // If destSlot is occupied, check if destination player is compatible with source slot
            if (destPlayerId) {
                const destPlayer = players.find(x => x.id === destPlayerId);
                if (!destPlayer) return false;
                if (!isCompatiblePosition(srcSlot, destPlayer.position, destPlayer.altPositions)) {
                    return false;
                }
            }
            
            return true;
        }

        // --- 10. SQUAD BUILDER PITCH LOGIC ---
        function buildPitch() {
            const pitch = document.getElementById('football-pitch');
            const formationVal = document.getElementById('formation-select').value;
            const slotsData = FORMATIONS[formationVal];

            const oldSlots = pitch.querySelectorAll('.pitch-slot');
            oldSlots.forEach(s => s.remove());

            for (let slotPos in slotsData) {
                const coord = slotsData[slotPos];
                const slotDiv = document.createElement('div');
                slotDiv.className = 'pitch-slot';
                // On mobile portrait, use vertical pitch layout (GK at bottom, FW at top)
                // FORMATIONS data: coord.left = horizontal %, coord.bottom = vertical % from bottom
                const isMobilePortrait = window.matchMedia('(max-width: 768px) and (orientation: portrait)').matches;
                if (isMobilePortrait) {
                    // Vertical pitch: left stays horizontal, top = 100% - bottom (flip so GK bottom)
                    slotDiv.style.left = coord.left;
                    slotDiv.style.top = (100 - parseFloat(coord.bottom)) + '%';
                } else {
                    // Horizontal pitch (default desktop): swap axes
                    slotDiv.style.left = coord.bottom;
                    slotDiv.style.top = coord.left;
                }
                
                // Drag and drop event listeners setup
                slotDiv.setAttribute('data-slot', slotPos);
                slotDiv.addEventListener('dragover', handleDragOver);
                slotDiv.addEventListener('dragenter', handleDragEnter);
                slotDiv.addEventListener('dragleave', handleDragLeave);
                slotDiv.addEventListener('drop', handleDrop);

                const playerId = squad[slotPos];
                const player = players.find(x => x.id === playerId);

                if (player) {
                    // Make occupied slots draggable
                    slotDiv.setAttribute('draggable', 'true');
                    slotDiv.addEventListener('dragstart', handleDragStart);
                    slotDiv.addEventListener('dragend', handleDragEnd);
                    
                    const themeClass = getCardThemeClass(player);
                    const displayName = player.cardName || getShortName(player.name);
                    const isIcons = player.cardTheme === 'icons';
                    const isMM = player.cardTheme === 'mm';
                    const isTOTY = player.cardTheme === 'toty';
                    const isUCL = player.cardTheme === 'ucl';
                    const isVNLegends = player.cardTheme === 'vnlegends';
                    const isGC = player.cardTheme === 'gc';

                    let photoHTML;
                    if (player.photo) {
                        photoHTML = `<img src="${player.photo}" alt="${player.name}">`;
                    } else {
                        photoHTML = `<svg class="panini-photo-silhouette" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
                    }

                    const flagHTML = getFlagImgHTML(player.nationality, player.flag);

                    const footerHTML = isIcons
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">★ ICONS ★</div>`
                        : isMM
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">✦ MEMOIR ✦</div>`
                        : isTOTY
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">❄ TOTY 26 ❄</div>`
                        : isUCL
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">✦ UCL HERO ✦</div>`
                        : isVNLegends
                        ? `<div class="panini-name">${displayName}</div>
                           <div class="panini-era">★ VIETNAM LEGENDS ★</div>`
                        : `<div class="panini-name">${displayName}</div>
                           <div class="panini-club">${player.club || ''}</div>`;

                    slotDiv.innerHTML = `
                        <div class="pitch-player-card-container" onclick="openSquadSelector('${slotPos}')">
                            <button class="mini-remove-btn" onclick="event.stopPropagation(); removePlayerFromSlot('${slotPos}')">×</button>
                            <div class="player-card ${themeClass}">
                                <div class="panini-band">
                                    <div class="panini-ovr">${player.rating}</div>
                                    <div class="panini-pos">${player.position}</div>
                                </div>
                                <div class="panini-photo">
                                    ${photoHTML}
                                    <div class="panini-card-flag" title="${player.nationality}">${flagHTML}</div>
                                </div>
                                <div class="panini-footer">${footerHTML}</div>
                                <div class="card-theme-triangle">
                                    <span class="card-theme-triangle-icon">${getCardThemeIcon(player)}</span>
                                </div>
                            </div>
                        </div>
                        <div class="pitch-slot-label">${displayName}</div>
                    `;
                } else {
                    slotDiv.innerHTML = `
                        <div class="slot-empty-placeholder" onclick="openSquadSelector('${slotPos}')">
                            <i data-lucide="plus"></i>
                            <span>${getDisplayPos(slotPos)}</span>
                        </div>
                        <div class="pitch-slot-label" style="color:rgba(255,255,255,0.55);">${getDisplayPos(slotPos)}</div>
                    `;
                }

                pitch.appendChild(slotDiv);
            }
            lucide.createIcons();
        }

        // Export Squad as Image
        function exportSquadImage() {
            const pitch = document.getElementById('football-pitch');
            if (!pitch) return;
            
            // Get export button to show loading spinner
            const btn = document.querySelector('button[onclick="exportSquadImage()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="animate-spin">⏳</i> Đang tạo ảnh...';
            btn.disabled = true;

            // Add exporting class to hide UI elements (like remove buttons)
            pitch.classList.add('is-exporting');

            // Temporarily replace the pitch's complex background-image gradients with a single flat color
            // to prevent rendering glitches in html2canvas (e.g. black screen or missing stripes)
            const bgWrapper = pitch.querySelector('.pitch-bg-wrapper');
            let originalBg = "";
            let originalBgImage = "";
            if (bgWrapper) {
                originalBg = bgWrapper.style.background;
                originalBgImage = bgWrapper.style.backgroundImage;
                bgWrapper.style.background = '#143819';
                bgWrapper.style.backgroundImage = 'none';
            }

            // Wait a tiny bit for DOM changes to settle
            setTimeout(() => {
                html2canvas(pitch, {
                    scale: 2, // High resolution export
                    useCORS: true,
                    allowTaint: false, // Prevents security errors for tainted canvas
                    backgroundColor: '#143819', // Match pitch green
                    logging: false
                }).then(canvas => {
                    // Restore original classes and backgrounds
                    pitch.classList.remove('is-exporting');
                    if (bgWrapper) {
                        bgWrapper.style.background = originalBg;
                        bgWrapper.style.backgroundImage = originalBgImage;
                    }
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    
                    const formationSelect = document.getElementById('formation-select');
                    const formationName = formationSelect ? formationSelect.value.replace(/\s+/g, '_') : 'squad';

                    // Trigger image download
                    const link = document.createElement('a');
                    link.download = `squad_${formationName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("Đã xuất ảnh đội hình thành công!");
                }).catch(err => {
                    console.error('Error generating image:', err);
                    pitch.classList.remove('is-exporting');
                    if (bgWrapper) {
                        bgWrapper.style.background = originalBg;
                        bgWrapper.style.backgroundImage = originalBgImage;
                    }
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                    showToast("Có lỗi xảy ra khi tạo ảnh đội hình!");
                });
            }, 100);
        }

        // Clear pitch
        function clearSquad() {
            if (confirm("Bạn có chắc chắn muốn xóa hết cầu thủ ra khỏi đội hình chiến thuật?")) {
                squad = {};
                saveDatabase();
                buildPitch();
                updateSquadStats();
                showToast("Đã làm trống sân bóng.");
            }
        }

        function removePlayerFromSlot(slotPos) {
            delete squad[slotPos];
            saveDatabase();
            buildPitch();
            updateSquadStats();
        }

        // --- SQUAD SELECTOR MODAL ---
        function openSquadSelector(slotPos) {
            activeSlotSelection = slotPos;
            const modal = document.getElementById('squad-selector-modal');
            const title = document.getElementById('modal-title');
            title.textContent = `Chọn Cầu Thủ Vào Vị Trí [${getDisplayPos(slotPos)}]`;

            document.getElementById('modal-search-input').value = '';

            renderModalPlayers();
            modal.classList.add('active');
        }

        // Close squad selector modal
        function closeModal() {
            document.getElementById('squad-selector-modal').classList.remove('active');
            activeSlotSelection = null;
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'squad-selector-modal') {
                closeModal();
            }
        }

        function renderModalPlayers() {
            const query = document.getElementById('modal-search-input').value.toLowerCase().trim();
            const listContainer = document.getElementById('modal-player-list');
            const selectedIds = Object.values(squad);

            let available = players.filter(p => {
                if (selectedIds.includes(p.id) && squad[activeSlotSelection] !== p.id) {
                    return false;
                }
                
                // Position compatibility check (main or alt-pos)
                if (!isCompatiblePosition(activeSlotSelection, p.position, p.altPositions)) {
                    return false;
                }
                
                if (query) {
                    return p.name.toLowerCase().includes(query) ||
                           p.club.toLowerCase().includes(query) ||
                           p.position.toLowerCase().includes(query);
                }
                return true;
            });

            available.sort((a,b) => b.rating - a.rating);

            if (available.length === 0) {
                listContainer.innerHTML = `<p style="text-align:center; padding:2rem; color:var(--text-muted);">Không có cầu thủ nào khớp vị trí [${getDisplayPos(activeSlotSelection)}].</p>`;
                return;
            }

            const displayedAvailable = available.slice(0, 100);

            listContainer.innerHTML = displayedAvailable.map(p => {
                const isCurrent = squad[activeSlotSelection] === p.id;
                const activeStyle = isCurrent ? 'style="border-color: var(--accent); background: rgba(16, 185, 129, 0.1);"' : '';
                const rowFlagHTML = getFlagImgHTML(p.nationality, p.flag);
                return `
                    <div class="player-select-row" ${activeStyle} onclick="selectPlayerForSlot('${p.id}')">
                        <div class="player-select-info">
                            <div class="select-row-ovr">${p.rating}</div>
                            <div>
                                <div class="select-row-name">
                                    ${p.name} ${p.cardName ? `<span class="select-row-card-name" style="font-size:0.75rem; color:var(--text-muted); font-weight:normal; margin-left:0.4rem;">(${p.cardName})</span>` : ''}
                                    <span class="select-row-pos">${p.position}</span>
                                </div>
                                <div class="select-row-details" style="display:flex; align-items:center; gap:0.4rem; margin-top:0.25rem;">
                                    ${rowFlagHTML} <span>${p.nationality} • ${p.clubBadge} ${p.club}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            ${isCurrent ? '<i data-lucide="check-circle-2" style="color:var(--accent);"></i>' : '<i data-lucide="chevron-right" style="color:var(--text-muted)"></i>'}
                        </div>
                    </div>
                `;
            }).join('');
            
            lucide.createIcons();
        }

        function filterModalPlayers() {
            renderModalPlayers();
        }

        function selectPlayerForSlot(playerId) {
            if (!activeSlotSelection) return;

            squad[activeSlotSelection] = playerId;
            saveDatabase();
            closeModal();
            buildPitch();
            updateSquadStats();
            
            const p = players.find(x => x.id === playerId);
            if (p) showToast(`Đã đưa ${getShortName(p.name)} vào vị trí ${getDisplayPos(activeSlotSelection)}`);
        }

        function selectRandomPlayerForActiveSlot() {
            if (!activeSlotSelection) return;

            const selectedIds = Object.values(squad);
            
            // Limit to players matching the position (primary or alt), having a photo, and not already in other slots
            let available = players.filter(p => {
                if (selectedIds.includes(p.id) && squad[activeSlotSelection] !== p.id) {
                    return false;
                }
                return !!p.photo && isCompatiblePosition(activeSlotSelection, p.position, p.altPositions);
            });

            if (available.length === 0) {
                showToast(`Không có cầu thủ nào phù hợp cho vị trí ${getDisplayPos(activeSlotSelection)}.`);
                return;
            }

            // Assign weights: primary position matches get 1.5x, alternative matches get 1.0x
            const weights = available.map(p => {
                const mapping = {
                    "GK": ["GK"], "LB": ["LB", "LWB"], "RB": ["RB", "RWB"],
                    "LWB": ["LWB", "LB"], "RWB": ["RWB", "RB"], "CB": ["CB"],
                    "LCB": ["CB"], "RCB": ["CB"], "CDM": ["CDM"],
                    "LDM": ["CDM"], "RDM": ["CDM"], "CM": ["CM"],
                    "LCM": ["CM"], "RCM": ["CM"], "LM": ["LM", "LW"],
                    "RM": ["RM", "RW"], "CAM": ["CAM"], "CAM1": ["CAM", "CF"],
                    "CAM2": ["CAM", "CF"], "LW": ["LW", "LM"], "RW": ["RW", "RM"],
                    "ST": ["ST", "CF"], "LST": ["ST", "CF"], "RST": ["ST", "CF"],
                    "ST1": ["ST", "CF"], "ST2": ["ST", "CF"], "CF1": ["CF", "ST"],
                    "CF2": ["CF", "ST"]
                };
                const targets = mapping[activeSlotSelection] || [activeSlotSelection];
                const isPrimaryMatch = targets[0] === p.position;
                return isPrimaryMatch ? 1.5 : 1.0;
            });

            // Cumulative sum of weights
            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            let randomValue = Math.random() * totalWeight;
            
            let selectedPlayer = available[0];
            for (let i = 0; i < available.length; i++) {
                randomValue -= weights[i];
                if (randomValue <= 0) {
                    selectedPlayer = available[i];
                    break;
                }
            }
            
            selectPlayerForSlot(selectedPlayer.id);
        }

        // --- SQUAD RATING & CHEMISTRY CALCULATOR ---
        function updateSquadStats() {
            const formationVal = document.getElementById('formation-select').value;
            const slots = Object.keys(FORMATIONS[formationVal]);
            
            let totalRating = 0;
            let count = 0;
            let activePlayersOnPitch = [];

            slots.forEach(slot => {
                const pid = squad[slot];
                const player = players.find(x => x.id === pid);
                if (player) {
                    totalRating += player.rating;
                    count++;
                    activePlayersOnPitch.push({ player, slot });
                }
            });

            const teamOvr = count > 0 ? Math.round(totalRating / count) : 0;
            document.getElementById('team-rating').textContent = teamOvr.toString().padStart(2, '0');

            let totalChem = 0;

            activePlayersOnPitch.forEach(item => {
                let pChem = 0;
                const p = item.player;
                const slot = item.slot;

                let posMatch = false;
                if (slot.includes("GK") && p.position === "GK") posMatch = true;
                else if ((slot.includes("ST") || slot.includes("LW") || slot.includes("RW")) && ["ST", "CF", "LW", "RW"].includes(p.position)) posMatch = true;
                else if ((slot.includes("CM") || slot.includes("DM") || slot.includes("CAM")) && ["CM", "CDM", "CAM"].includes(p.position)) posMatch = true;
                else if ((slot.includes("LM") || slot.includes("RM")) && ["LM", "RM", "LW", "RW"].includes(p.position)) posMatch = true;
                else if ((slot.includes("CB") || slot.includes("DF")) && p.position === "CB") posMatch = true;
                else if ((slot.includes("LB") || slot.includes("RB")) && ["LB", "RB", "CB"].includes(p.position)) posMatch = true;

                if (posMatch) pChem += 1;

                const sameClubCount = activePlayersOnPitch.filter(x => x.player.id !== p.id && x.player.club === p.club).length;
                if (sameClubCount >= 2) pChem += 1;
                else if (sameClubCount >= 1 && pChem < 2) pChem += 1;

                const sameNationCount = activePlayersOnPitch.filter(x => x.player.id !== p.id && x.player.nationality === p.nationality).length;
                if (sameNationCount >= 2) pChem += 1;
                else if (sameNationCount >= 1 && pChem < 3) pChem += 1;

                totalChem += Math.min(3, pChem);
            });

            const maxPossibleChem = count * 3;
            const chemEl = document.getElementById('team-chemistry');
            chemEl.textContent = `${totalChem}/${maxPossibleChem}`;
            
            if (count === 11) {
                if (totalChem >= 28) {
                    chemEl.style.color = 'var(--accent)';
                } else if (totalChem >= 15) {
                    chemEl.style.color = '#e5a93b';
                } else {
                    chemEl.style.color = '#ef4444';
                }
            } else {
                chemEl.style.color = 'var(--text-muted)';
            }
        }

        // --- 11. TOAST NOTIFICATION UTILS ---
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <i data-lucide="info" style="color: var(--accent); width:18px; height:18px;"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.add('show');
            }, 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        // --- 12. ORIENTATION CHANGE: Rebuild pitch on rotate ---
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                buildPitch();
            }, 200); // Short delay so screen dims are updated
        });
        window.addEventListener('resize', (() => {
            let resizeTimer;
            return () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => buildPitch(), 250);
            };
        })());

        // --- 13. MOBILE DROPDOWN OVERFLOW FIX ---
        // Reposition dropdown menus to avoid viewport overflow on small screens
        function repositionDropdownMenu(menu) {
            if (window.innerWidth > 768) return; // Only needed on mobile
            // Reset to default so we can measure
            menu.style.left = '';
            menu.style.right = '';
            menu.style.top = '';
            menu.style.position = 'fixed';

            const trigger = menu.closest('.filter-chip, .form-group');
            if (!trigger) return;
            const rect = trigger.getBoundingClientRect();
            const menuW = Math.min(280, window.innerWidth - 16);

            let left = rect.left;
            if (left + menuW > window.innerWidth - 8) {
                left = window.innerWidth - menuW - 8;
            }
            if (left < 8) left = 8;

            menu.style.left = left + 'px';
            menu.style.top = (rect.bottom + 6) + 'px';
            menu.style.width = menuW + 'px';
            menu.style.maxWidth = menuW + 'px';
        }

        // Patch initCustomDropdowns to also reposition on show
        const _origInitCustomDropdowns = initCustomDropdowns;
        function initCustomDropdownsMobile() {
            // Run original
            document.querySelectorAll('.filter-chip.custom-dropdown, .form-group.custom-dropdown').forEach(chip => {
                if (chip.dataset.mobileRepositionBound) return;
                chip.dataset.mobileRepositionBound = 'true';
                chip.addEventListener('click', (e) => {
                    const menu = chip.querySelector('.custom-dropdown-menu');
                    if (menu && menu.classList.contains('show')) {
                        repositionDropdownMenu(menu);
                    }
                }, true);
            });
        }
        // Re-run after initial load
        setTimeout(initCustomDropdownsMobile, 500);
    </script>
</body>
</html>
