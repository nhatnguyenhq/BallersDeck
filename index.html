                if (m.teamA.isUser || m.teamB.isUser) {
                    if (m.winner.isUser) {
                        achievementText = `<strong>${userEntry.name}</strong> đã xuất sắc đánh bại mọi đối thủ và <strong style="color:#c9a227;">VÔ ĐỊCH</strong> UEFA Champions League! Một mùa giải lịch sử!`;
                        achievementIcon = "🏆";
                    } else {
                        achievementText = `<strong>${userEntry.name}</strong> nỗ lực phi thường nhưng tiếc nuối về nhì ở trận <strong>Chung kết</strong> — Á quân xứng đáng!`;
                        achievementIcon = "🥈";
                    }
                } else if (sim.sfMatches && sim.sfMatches.some(x => x.homeLeg1.isUser || x.awayLeg1.isUser)) {
                    achievementText = `<strong>${userEntry.name}</strong> thi đấu quả cảm, dừng bước tại <strong>Bán kết</strong> (Top 4).`;
                } else if (sim.qfMatches && sim.qfMatches.some(x => x.homeLeg1.isUser || x.awayLeg1.isUser)) {
                    achievementText = `<strong>${userEntry.name}</strong> tiến vào vòng đấu của 8 đội mạnh nhất, dừng bước ở <strong>Tứ kết</strong>.`;
                } else if (sim.r16Matches && sim.r16Matches.some(x => x.homeLeg1.isUser || x.awayLeg1.isUser)) {
                    achievementText = `<strong>${userEntry.name}</strong> dừng bước ở vòng <strong>1/8 (Round of 16)</strong>.`;
                } else if (sim.playoffMatches && sim.playoffMatches.some(x => x.homeLeg1.isUser || x.awayLeg1.isUser)) {
                    achievementText = `<strong>${userEntry.name}</strong> dừng bước ở vòng <strong>Play-off</strong> (xếp hạng ${userRank} Swiss Stage).`;
                } else {
                    achievementText = `<strong>${userEntry.name}</strong> bị loại ngay từ <strong>Vòng bảng</strong> với vị trí hạng ${userRank}/36.`;
                    achievementIcon = "❌";
                }

                userSquadHTML = `
                    <div style="font-family:'Inter',sans-serif;background:rgba(201,162,39,0.06);border:1px solid rgba(201,162,39,0.2);border-radius:12px;padding:1.1rem;text-align:left;">
                        <div style="font-size:0.72rem;color:rgba(201,162,39,0.7);text-transform:uppercase;font-weight:700;letter-spacing:0.1em;margin-bottom:0.5rem;">⚑ Hành trình của bạn</div>
                        <div style="font-size:0.92rem;color:#fff;line-height:1.6;margin-bottom:0.6rem;">${achievementIcon} ${achievementText}</div>
                        <div style="font-size:0.76rem;color:rgba(255,255,255,0.35);border-top:1px solid rgba(201,162,39,0.1);padding-bottom:0.5rem;">
                            Vòng bảng: <span style="color:rgba(255,255,255,0.7);font-weight:600;">${statsText} — Hạng ${userRank}/36</span>
                        </div>
                        ${journeyMatchesHTML}
                    </div>
                `;
            }

            const topScorers = sim.getTopScorers().slice(0, 10);
            let topScorersHTML = "";
            if (topScorers.length > 0) {
                const rows = topScorers.map((s, idx) => {
                    return `
                        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px; padding: 0.35rem 0.6rem; font-size: 0.8rem;">
                            <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
                                <span style="font-weight: 700; color: #c9a227; min-width: 20px;">${idx + 1}.</span>
                                <strong style="color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${s.name}</strong>
                                <span style="font-size: 0.72rem; color: rgba(255,255,255,0.4);">(${s.club})</span>
                            </div>
                            <div style="font-weight: 800; color: #e8c547; font-size: 0.9rem;">
                                ${s.goals} ⚽
                            </div>
                        </div>
                    `;
                }).join('');

                topScorersHTML = `
                    <div style="margin-top: 1rem; border-top: 1px solid rgba(201,162,39,0.15); padding-top: 0.8rem; text-align: left;">
                        <div style="font-size: 0.72rem; color: rgba(201,162,39,0.7); text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 4px;">
                            <i data-lucide="award" style="width: 12px; height: 12px;"></i> Vua Phá Lưới (Top 10):
                        </div>
                        <div style="max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.45rem; padding-right: 0.25rem;">
                            ${rows}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="sim-setup-box" style="max-width:640px;border-color:rgba(201,162,39,0.4);background:radial-gradient(circle at 50% -10%,rgba(201,162,39,0.15) 0%,rgba(4,11,27,0.95) 65%);">
                    <div style="font-size:4.5rem;animation:ucl-trophy-bounce 1.5s ease-in-out infinite;line-height:1;">🏆</div>
                    <div style="font-size:0.75rem;font-weight:800;letter-spacing:0.2em;color:rgba(201,162,39,0.7);text-transform:uppercase;">UEFA Champions League · Champions</div>
                    <div style="display:flex;align-items:center;justify-content:center;gap:0.6rem;flex-wrap:wrap;">
                        <span style="font-size:2rem;">${flagChampHTML}</span>
                        <span style="font-family:'Plus Jakarta Sans',sans-serif;font-size:2rem;font-weight:900;background:linear-gradient(135deg,#c9a227 0%,#fff 50%,#c9a227 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200%;animation:ucl-shimmer 3s linear infinite;">${m.winner.name}</span>
                        <span style="font-size:2rem;">${flagChampHTML}</span>
                    </div>
                    <p style="font-family:'Inter',sans-serif;color:rgba(255,255,255,0.6);font-size:0.88rem;line-height:1.7;margin:0;">${congratsText}</p>

                    <div style="background:rgba(4,11,27,0.6);border:1px solid rgba(201,162,39,0.2);border-radius:12px;padding:1rem;">
                        <div style="font-size:0.7rem;color:rgba(201,162,39,0.6);text-transform:uppercase;font-weight:700;letter-spacing:0.1em;margin-bottom:0.6rem;">Kết quả Chung kết</div>
                        <div style="display:flex;justify-content:center;align-items:center;gap:1rem;font-weight:700;font-size:1.1rem;">
                            <span style="${m.teamA.isUser ? 'color:#c9a227;' : 'color:#fff;'}">${m.teamA.name}</span>
                            <span class="score-cell" style="font-size:1.2rem;padding:0.3rem 0.7rem;">${m.goalsA} – ${m.goalsB}</span>
                            <span style="${m.teamB.isUser ? 'color:#c9a227;' : 'color:#fff;'}">${m.teamB.name}</span>
                        </div>
                        ${m.penaltyWinner ? `<div style="font-size:0.78rem;color:#f59e0b;font-weight:600;margin-top:0.4rem;">(Luân lưu: ${m.winner.name} thắng ${m.penaltyA}–${m.penaltyB})</div>` : ''}
                        <div style="display:flex;justify-content:space-between;margin-top:0.65rem;padding-top:0.55rem;border-top:1px solid rgba(255,255,255,0.06);font-size:0.8rem;line-height:1.65;text-align:left;">
                            <div style="flex:1;padding-right:0.5rem;">
                                ${window.groupScorers(m.scorersA || []).map(s => `<div style="color:rgba(255,255,255,0.85);">⚽ <strong>${s.name}</strong> <span style="color:rgba(255,255,255,0.35);font-size:0.72rem;">(${s.minutes.join(', ')})</span></div>`).join('') || `<div style="color:rgba(255,255,255,0.2);font-style:italic;font-size:0.76rem;">—</div>`}
                            </div>
                            <div style="flex:1;padding-left:0.5rem;text-align:right;">
                                ${window.groupScorers(m.scorersB || []).map(s => `<div style="color:rgba(255,255,255,0.85);"><span style="color:rgba(255,255,255,0.35);font-size:0.72rem;">(${s.minutes.join(', ')})</span> <strong>${s.name}</strong> ⚽</div>`).join('') || `<div style="color:rgba(255,255,255,0.2);font-style:italic;font-size:0.76rem;">—</div>`}
                            </div>
                        </div>
                    </div>

                    ${userSquadHTML}
                    ${topScorersHTML}

                    <button class="btn" onclick="resetSimulation()" style="width:100%;justify-content:center;padding:0.9rem;font-size:0.95rem;background:linear-gradient(135deg,#c9a227 0%,#e8c547 50%,#c9a227 100%)!important;color:#07112a!important;border:none!important;font-weight:900;letter-spacing:0.1em;background-size:200%;animation:ucl-shimmer 2.5s linear infinite;">
                        <i data-lucide="rotate-ccw"></i> BẮT ĐẦU GIẢI ĐẤU MỚI
                    </button>
                </div>
            `;
        }



        // TRIGGER FUNCTIONS
        window.simNextRound = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.runNextSwissRound();
            showToast(`Đã mô phỏng xong Vòng Swiss thứ ${window.currentUCLSim.currentRound + 1}!`);
            renderSimulationDashboard();
        };

        window.simAllSwiss = function() {
            if (!window.currentUCLSim) return;
            const sim = window.currentUCLSim;
            while (true) {
                if (sim.currentRound === 7 && sim.roundPhase === "results") {
                    break;
                }
                if (sim.roundPhase === "setup") {
                    sim.runNextSwissRound();
                } else if (sim.roundPhase === "results") {
                    sim.advanceSwissRound();
                }
            }
            showToast("Đã mô phỏng xong toàn bộ 8 Vòng Swiss!");
            renderSimulationDashboard();
        };

        window.nextSwissRound = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.advanceSwissRound();
            renderSimulationDashboard();
        };

        window.goToKnockouts = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.stage = "playoff";
            window.currentUCLSim.generatePlayoffMatchups();
            showToast("Đã bốc cặp Vòng Play-off Knockout!");
            renderSimulationDashboard();
        };

        window.simPlayoffLeg1 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulatePlayoffLeg1();
            showToast("Đã mô phỏng xong Play-off Lượt đi!");
            renderSimulationDashboard();
        };

        window.simPlayoffLeg2 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulatePlayoffLeg2();
            showToast("Đã mô phỏng xong Play-off Lượt về!");
            renderSimulationDashboard();
        };

        window.nextPlayoffToR16 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.advancePlayoffToR16();
            showToast("Đã bốc cặp Vòng 1/8!");
            renderSimulationDashboard();
        };

        window.simR16Leg1 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulateR16Leg1();
            showToast("Đã mô phỏng xong Vòng 1/8 Lượt đi!");
            renderSimulationDashboard();
        };

        window.simR16Leg2 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulateR16Leg2();
            showToast("Đã mô phỏng xong Vòng 1/8 Lượt về!");
            renderSimulationDashboard();
        };

        window.nextR16ToQF = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.advanceR16ToQF();
            showToast("Đã bốc cặp Vòng Tứ kết!");
            renderSimulationDashboard();
        };

        window.simQFLeg1 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulateQFLeg1();
            showToast("Đã mô phỏng xong Tứ kết Lượt đi!");
            renderSimulationDashboard();
        };

        window.simQFLeg2 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulateQFLeg2();
            showToast("Đã mô phỏng xong Tứ kết Lượt về!");
            renderSimulationDashboard();
        };

        window.nextQFToSF = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.advanceQFToSF();
            showToast("Đã bốc cặp Vòng Bán kết!");
            renderSimulationDashboard();
        };

        window.simSFLeg1 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulateSFLeg1();
            showToast("Đã mô phỏng xong Bán kết Lượt đi!");
            renderSimulationDashboard();
        };

        window.simSFLeg2 = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.simulateSFLeg2();
            showToast("Đã mô phỏng xong Bán kết Lượt về!");
            renderSimulationDashboard();
        };

        window.nextSFToFinal = function() {
            if (!window.currentUCLSim) return;
            window.currentUCLSim.advanceSFToFinal();
            showToast("Đã xác định 2 đội vào Chung kết!");
            renderSimulationDashboard();
        };

        window.simFinal = function() {
            if (!window.currentUCLSim) return;
            const sim = window.currentUCLSim;
            if (sim.finalMatch.goalsA === null) {
                sim.simulateFinal();
                showToast(`Trận Chung kết đã kết thúc! Nhà vô địch là: ${sim.finalMatch.winner.name}`);
            } else {
                sim.stage = "ended";
            }
            renderSimulationDashboard();
        };

        window.resetSimulation = function() {
            if (confirm("Bạn có chắc muốn hủy bỏ giải đấu hiện tại và bắt đầu lại?")) {
                window.currentUCLSim = null;
                initSimulationUI();
            }
        };

        window.toggleMatchDetails = function(el, event) {
            if (event.target.closest('button') || event.target.closest('a') || event.target.closest('.btn')) return;
            const panel = el.querySelector('.match-details-panel');
            if (panel) {
                const isHidden = panel.style.display === 'none';
                panel.style.display = isHidden ? 'block' : 'none';
            }
        };

        // Custom bounce & pulse animations for UCL tab
        const simAnimStyle = document.createElement('style');
        simAnimStyle.textContent = `
            @keyframes pulse {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.1); }
            }
            @keyframes bounce {
                from { transform: translateY(0); }
                to { transform: translateY(-10px); }
            }
        `;
        document.head.appendChild(simAnimStyle);

        function initCustomDropdownsMobile() {
            // Run original
            document.querySelectorAll('.filter-chip.custom-dropdown, .form-group.custom-dropdown').forEach(chip => {
                if (chip.dataset.mobileRepositionBound) return;
                chip.dataset.mobileRepositionBound = 'true';
                chip.addEventListener('click', (e) => {
                    const menu = chip.querySelector('.custom-dropdown-menu');
                    if (menu && menu.classList.contains('show')) {
                        repositionDropdownMenu(menu);
                    }
                }, true);
            });
        }
        // Re-run after initial load
        setTimeout(initCustomDropdownsMobile, 500);
    </script>
</body>
</html>
